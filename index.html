<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="恐龙快跑（黄州府）——穿越黄州名胜古迹的跑酷小游戏">
  <meta name="theme-color" content="#0a0f1a">
  <title>恐龙快跑（黄州府）</title>
  <link rel="stylesheet" href="dino.css?v=20260807">
  <link rel="icon" type="image/png" href="game/assets/小恐龙-removebg-preview.webp">
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-bar"><div id="loading-progress"></div></div>
    <p id="loading-text">加载中…</p>
  </div>

  <!-- Game canvas -->
  <canvas id="game"></canvas>

  <!-- Score -->
  <div id="score">Run,run,run: 0</div>

  <!-- Sound toggle -->
  <button id="sound-toggle" title="音乐">🔊</button>

  <!-- Start screen -->
  <div id="startscreen" class="overlay">
    <h1>恐龙快跑</h1>
    <p class="sub">黄州府</p>
    <button id="start" class="btn">开始游戏</button>
    <div class="controls-card">
      <p class="controls-title">🎮 操作说明</p>
      <div class="controls-grid">
        <div class="ctrl"><kbd>空格</kbd><kbd>↑</kbd><span>跳跃</span></div>
        <div class="ctrl"><kbd>←</kbd><kbd>→</kbd><span>左右移动</span></div>
        <div class="ctrl"><kbd>M</kbd><span>切换音乐</span></div>
      </div>
      <p class="controls-mobile">📱 手机/平板：屏幕底部有虚拟按键，点击操作</p>
      </div>
    </div>
  </div>

  <!-- Game over -->
  <div id="gameover" class="overlay" hidden>
    <h1>游戏结束</h1>
    <p id="final-score"></p>
    <button id="restart" class="btn">再来一局</button>
  </div>

  <!-- Mobile controls -->
  <div id="mobile-controls" class="mobile-ctrl">
    <button id="btn-left" class="ctrl-btn ctrl-btn--side" aria-label="左移·跳跃">
      <svg viewBox="0 0 24 24" width="32" height="32"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/></svg>
    </button>
    <button id="btn-music" class="ctrl-btn ctrl-btn--music" aria-label="切换音乐" title="切歌">🎵</button>
    <button id="btn-right" class="ctrl-btn ctrl-btn--side" aria-label="右移·跳跃">
      <svg viewBox="0 0 24 24" width="32" height="32"><path d="M8.59 16.59L10 18l6-6-6-6-1.41 1.41L13.17 12z" fill="currentColor"/></svg>
    </button>
  </div>

  <script src="dino.js?v=20260807"></script>
</body>
</html>
