<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="恐龙快跑（黄州府）——穿越黄州名胜古迹的跑酷小游戏">
  <meta name="theme-color" content="#07c160">
  <title>恐龙快跑（黄州府）</title>
  <link rel="stylesheet" href="dino.css?v=20260827a">
  <link rel="icon" type="image/png" href="game/assets/小恐龙-removebg-preview.webp">
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-dino">🦕</div>
    <div class="loading-bar"><div id="loading-progress"></div></div>
    <p id="loading-text">加载中…</p>
  </div>

  <!-- Game canvas -->
  <canvas id="game"></canvas>

  <!-- Score -->
  <div id="score">
    <span class="score-label">分数</span>
    <span id="score-current">0</span>
    <span class="score-sep">/</span>
    <span id="score-target">10</span>
  </div>

  <!-- Top-center controls (sound / music / flight) -->
  <div id="top-controls">
    <button id="sound-toggle" title="音乐开关" aria-label="音乐开关">🔊</button>
    <button id="btn-music" class="top-btn" title="切歌" aria-label="切歌">🎵</button>
    <button id="btn-flight" class="top-btn" title="开启飞翔模式" aria-label="开启飞翔模式" aria-pressed="false">
      <svg class="flight-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.3 5.1c-.7.3-1.4.5-2.2.6a3.8 3.8 0 0 0-6.6 2.6c0 .3 0 .6.1.9A10.8 10.8 0 0 1 4.7 5.2a3.8 3.8 0 0 0 1.2 5.1c-.6 0-1.2-.2-1.7-.5 0 1.8 1.3 3.4 3.1 3.7-.3.1-.7.1-1 .1-.2 0-.5 0-.7-.1.5 1.5 1.9 2.6 3.6 2.6a7.7 7.7 0 0 1-4.8 1.7c-.3 0-.6 0-.9-.1a10.8 10.8 0 0 0 5.8 1.7c7 0 10.8-5.8 10.8-10.8v-.5c.8-.5 1.4-1.2 1.9-2-.7.3-1.4.5-2.2.6.8-.5 1.4-1.2 1.7-2.1-.7.4-1.5.8-2.4.9a3.8 3.8 0 0 0 2.2-.4Z"/></svg>
    </button>
  </div>

  <!-- Start screen (WeChat mini-game style) -->
  <div id="startscreen" class="overlay">
    <div class="wx-card">
      <div class="wx-card-header">
        <div class="wx-logo">🦕</div>
        <h1 class="wx-title">恐龙快跑</h1>
        <p class="wx-subtitle">黄州府 · 穿越名胜古迹</p>
      </div>

      <div class="wx-card-body">
        <!-- Difficulty selection -->
        <div class="wx-section">
          <p class="wx-section-label">选择难度</p>
          <div class="difficulty-grid">
            <button class="diff-btn" data-diff="casual">
              <span class="diff-icon">🌿</span>
              <span class="diff-name">休闲</span>
              <span class="diff-desc">轻松慢跑</span>
            </button>
            <button class="diff-btn" data-diff="novice">
              <span class="diff-icon">🍅</span>
              <span class="diff-name">上手</span>
              <span class="diff-desc">圣女火光</span>
            </button>
            <button class="diff-btn" data-diff="hooked">
              <span class="diff-icon">🦇</span>
              <span class="diff-name">入坑</span>
              <span class="diff-desc">空中危机</span>
            </button>
            <button class="diff-btn" data-diff="expert">
              <span class="diff-icon">🔥</span>
              <span class="diff-name">专家</span>
              <span class="diff-desc">极速挑战</span>
            </button>
          </div>
        </div>

        <!-- Target score -->
        <div class="wx-section">
          <p class="wx-section-label">
            目标分数
            <span class="wx-section-hint">设置你的挑战目标</span>
          </p>
          <div class="score-stepper">
            <button class="stepper-btn" id="score-minus" aria-label="减少">−</button>
            <input type="number" id="target-score-input" value="10" min="1" max="999" inputmode="numeric">
            <button class="stepper-btn" id="score-plus" aria-label="增加">+</button>
          </div>
        </div>

        <!-- Start button -->
        <button id="start" class="wx-btn-primary">开 始 游 戏</button>

        <!-- Controls hint -->
        <div class="wx-hint">
          <span class="wx-hint-item">⌨️ 空格/↑ 跳跃</span>
          <span class="wx-hint-item">← → 左右移动</span>
          <span class="wx-hint-item">📱 左屏摇杆 · 右屏跳跃</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Settlement screen (victory / defeat) -->
  <div id="gameover" class="overlay" hidden>
    <div class="wx-card wx-card--result">
      <div class="result-icon" id="result-icon">🦕</div>
      <h1 class="result-title" id="result-title">游戏结束</h1>
      <div class="result-score-box">
        <div class="result-score-row">
          <span class="result-score-label">本次得分</span>
          <span class="result-score-value" id="final-score">0</span>
        </div>
        <div class="result-score-row">
          <span class="result-score-label">目标分数</span>
          <span class="result-score-value" id="final-target">10</span>
        </div>
      </div>
      <p class="result-msg" id="result-msg"></p>
      <div class="result-btns">
        <button id="btn-home" class="wx-btn-secondary">返回首页</button>
        <button id="restart" class="wx-btn-primary">再来一次</button>
      </div>
    </div>
  </div>

  <!-- Mobile touch surface (fullscreen, handles dynamic joystick + jump) -->
  <div id="mobile-controls" class="mobile-ctrl"></div>

  <script src="dino.js?v=20260827a"></script>
</body>
</html>
