<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="恐龙快跑（黄州府）——穿越黄州名胜古迹的跑酷小游戏">
  <meta name="theme-color" content="#0a0f1a">
  <title>恐龙快跑（黄州府）</title>
  <link rel="stylesheet" href="dino.css?v=20260807">
  <link rel="icon" type="image/png" href="game/assets/小恐龙-removebg-preview.webp">
</head>
<body>

  <!-- Loading -->
  <div id="loading">
    <div class="loading-bar"><div id="loading-progress"></div></div>
    <p id="loading-text">加载中…</p>
  </div>

  <!-- Game canvas -->
  <canvas id="game"></canvas>

  <!-- Score -->
  <div id="score">Run,run,run: 0</div>

  <!-- Sound + Music -->
  <div id="top-controls">
    <button id="sound-toggle" title="音乐开关">🔊</button>
    <button id="btn-music" class="top-btn" title="切歌">🎵</button>
  </div>

  <!-- Start screen -->
  <div id="startscreen" class="overlay">
    <h1>恐龙快跑</h1>
    <p class="sub">黄州府</p>
    <button id="start" class="btn">开 始 游 戏</button>
    <div class="controls-card">
      <div class="ctrl-section">
        <p class="ctrl-section-title">⌨️ 电脑端</p>
        <div class="key-row"><kbd>空格</kbd><kbd>↑</kbd><span>跳跃</span></div>
        <div class="key-row"><kbd>←</kbd><kbd>→</kbd><span>左右移动</span></div>
        <div class="key-row key-row--top"><kbd>M</kbd><span>切歌</span><button class="icon-hint">🔊</button><span>音乐开关</span></div>
      </div>
      <div class="ctrl-section">
        <p class="ctrl-section-title">📱 手机 &amp; 平板</p>
        <div class="key-row"><span class="dot dot--left"></span><span>左半屏点按 → 跳跃</span></div>
        <div class="key-row"><span class="dot dot--right"></span><span>右半屏滑动 → 摇杆移动</span></div>
        <div class="key-row key-row--top"><button class="icon-hint">🔊</button><button class="icon-hint">🎵</button><span>右上角两个按钮控制音乐</span></div>
      </div>
    </div>

  <!-- Game over -->
  <div id="gameover" class="overlay" hidden>
    <h1>游戏结束</h1>
    <p id="final-score"></p>
    <button id="restart" class="btn">再来一局</button>
  </div>

  <!-- Mobile controls -->
  <div id="mobile-controls" class="mobile-ctrl">
    <button id="btn-jump" class="mbtn mbtn--jump" aria-label="跳跃">
      <span class="mbtn-icon">▲</span>
      <span class="mbtn-label">跳跃</span>
    </button>
    <div id="joystick-pad" class="joystick-pad">
      <div class="joystick-ring"></div>
      <div id="joystick-nub" class="joystick-nub"></div>
    </div>
  </div>

  <script src="dino.js?v=20260807"></script>
</body>
</html>
